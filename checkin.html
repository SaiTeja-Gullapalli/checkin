<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Employer Check-In</title>
<style>
  :root{
    --navy:#16233f; --navy-soft:#28395c; --paper:#f7f5f0; --gold:#b7862c;
    --ink:#1c1c1c; --line:#d9d4c8; --muted:#6b6b6b; --error:#a8352b; --ok:#3a6b46;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;padding:32px;}
  .card{width:100%;max-width:640px;background:#fff;border:1px solid var(--line);
    border-radius:4px;box-shadow:0 2px 24px rgba(22,35,63,.08);overflow:hidden;}
  .head{background:var(--navy);color:#fff;padding:34px 40px 28px;user-select:none;}
  .mark{width:40px;height:4px;background:var(--gold);margin-bottom:18px;}
  .head h1{margin:0;font-size:28px;font-weight:600;}
  .head p{margin:8px 0 0;color:#c7cfe0;font-size:15px;}
  .screen{display:none;padding:30px 40px 34px;}
  .screen.active{display:block;}

  .section-label{font-size:13px;font-weight:600;color:var(--navy-soft);margin:0 0 10px;}
  .event-list{display:grid;gap:10px;max-height:260px;overflow-y:auto;margin-bottom:22px;}
  .event-btn{text-align:left;padding:15px 16px;border:1.5px solid var(--line);border-radius:3px;
    background:var(--paper);font:inherit;font-size:16px;font-weight:600;color:var(--navy);cursor:pointer;}
  .event-btn small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:3px;}
  .event-btn.selected{border-color:var(--navy);background:#fff;box-shadow:inset 4px 0 0 var(--gold);}
  .note{color:var(--muted);font-size:14px;padding:6px 0 18px;}

  .field{margin-bottom:20px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--navy-soft);margin-bottom:6px;}
  .field input{width:100%;padding:14px 16px;font:inherit;font-size:17px;border:1.5px solid var(--line);
    border-radius:3px;background:var(--paper);color:var(--ink);}
  .field input:focus{outline:none;border-color:var(--navy-soft);background:#fff;}
  .field.invalid input{border-color:var(--error);}
  .field .err{display:none;font-size:12.5px;color:var(--error);margin-top:5px;}
  .field.invalid .err{display:block;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  .btn{width:100%;padding:16px;font:inherit;font-size:17px;font-weight:600;background:var(--navy);
    color:#fff;border:none;border-radius:3px;cursor:pointer;}
  .btn:disabled{background:#8b93a5;cursor:default;}
  .btn:not(:disabled):hover{background:var(--navy-soft);}
  .status{margin-top:14px;font-size:14px;text-align:center;min-height:18px;}
  .status.error{color:var(--error);}

  .footer{display:flex;justify-content:space-between;padding:0 40px 16px;font-size:12px;color:var(--muted);}

  .overlay{position:fixed;inset:0;background:var(--navy);color:#fff;display:none;align-items:center;
    justify-content:center;text-align:center;flex-direction:column;padding:40px;}
  .overlay.show{display:flex;}
  .check{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--gold);display:flex;
    align-items:center;justify-content:center;margin-bottom:22px;font-size:30px;color:var(--gold);}
  .overlay h2{margin:0 0 10px;font-size:24px;font-weight:600;}
  .overlay p{margin:0;color:#c7cfe0;font-size:15px;max-width:380px;}
</style>
</head>
<body>

<div class="card">
  <div class="head" id="head">
    <div class="mark"></div>
    <h1 id="headTitle">Kiosk setup</h1>
    <p id="headSub">Staff only: choose the event for this laptop.</p>
  </div>

  <!-- STAFF SETUP SCREEN -->
  <div class="screen active" id="screen-setup">
    <p class="section-label">Event</p>
    <div class="event-list" id="eventList"></div>
    <div class="note" id="eventNote" style="display:none;"></div>

    <div class="field">
      <label for="station">Station name (optional, e.g. "Table 3")</label>
      <input type="text" id="station" autocomplete="off">
    </div>

    <button class="btn" id="startBtn" disabled>Start check-in</button>
    <div class="status" id="setupStatus"></div>
  </div>

  <!-- EMPLOYER CHECK-IN SCREEN -->
  <div class="screen" id="screen-form">
    <form id="form" novalidate>
      <div class="field" id="f-name">
        <label for="name">Full name</label>
        <input type="text" id="name" autocomplete="off">
        <div class="err">Please enter your name.</div>
      </div>
      <div class="row2">
        <div class="field" id="f-company">
          <label for="company">Company</label>
          <input type="text" id="company" autocomplete="off">
          <div class="err">Please enter your company.</div>
        </div>
        <div class="field" id="f-jobTitle">
          <label for="jobTitle">Job title</label>
          <input type="text" id="jobTitle" autocomplete="off">
          <div class="err">Please enter your job title.</div>
        </div>
      </div>
      <div class="field" id="f-email">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="off">
        <div class="err">Please enter a valid email.</div>
      </div>
      <button type="submit" class="btn" id="submitBtn">Check in &amp; print name tag</button>
      <div class="status" id="formStatus"></div>
    </form>
  </div>

  <div class="footer" id="footer" style="display:none;">
    <span id="stationLabel"></span>
    <span id="queueLabel"></span>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="check">&#10003;</div>
  <h2>You're checked in</h2>
  <p id="overlayMsg">Your name tag is printing now. Welcome!</p>
</div>

<!-- DYMO Connect JavaScript framework: download dymo.connect.framework.js and put it in this same folder -->
<script src="dymo.connect.framework.js"></script>
<script>
/* =================== SETTINGS: edit these =================== */
const CONFIG = {
  FLOW_URL: "https://default2a00728ef0d040b4a4e8ce433f3fbc.a7.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/06/workflows/30158550df024f02ba3f40b3508cc092/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=F7C6GR3YP7e8fCqVCA5MXHa_8WqUA6i_Bg63xjuGbxM", // one URL for everything
  LABEL_FILE: "nametag.dymo",                      // your label template, same folder
  STAFF_PIN: "2627",                               // to leave check-in mode and change event
  RESET_DELAY_MS: 3500                             // how long the "checked in" screen shows
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let chosenEvent = null;
let labelXml = null;

/* ---------- talking to Power Automate ---------- */
async function api(action, payload = {}) {
  const res = await fetch(CONFIG.FLOW_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, ...payload })
  });
  if (!res.ok) throw new Error("Server responded " + res.status);
  const text = await res.text();
  return text ? JSON.parse(text) : {};
}

/* ---------- staff setup screen ---------- */
async function showSetup() {
  $("screen-setup").classList.add("active");
  $("screen-form").classList.remove("active");
  $("footer").style.display = "none";
  $("headTitle").textContent = "Kiosk setup";
  $("headSub").textContent = "Staff only: choose the event for this laptop.";
  $("station").value = store.get("kiosk.station", "");
  chosenEvent = null;
  $("startBtn").disabled = true;

  const list = $("eventList"), note = $("eventNote");
  list.innerHTML = ""; note.style.display = "block"; note.textContent = "Loading events…";

  try {
    const events = (await api("getEvents")).filter(ev => ev.status !== "Archived");
    if (!events.length) { note.textContent = "No events yet. Add one on the admin page."; return; }
    note.style.display = "none";
    events.forEach(ev => {
      const b = document.createElement("button");
      b.className = "event-btn"; b.type = "button";
      b.innerHTML = "";
      b.append(ev.name);
      if (ev.date) { const s = document.createElement("small"); s.textContent = ev.date; b.append(s); }
      b.onclick = () => {
        document.querySelectorAll(".event-btn").forEach(x => x.classList.remove("selected"));
        b.classList.add("selected"); chosenEvent = ev; $("startBtn").disabled = false;
      };
      list.appendChild(b);
    });
  } catch (e) {
    note.textContent = "Couldn't load events. Check the internet connection and the FLOW_URL setting.";
  }
}

$("startBtn").onclick = () => {
  if (!chosenEvent) return;
  store.set("kiosk.event", { id: String(chosenEvent.id), name: chosenEvent.name });
  store.set("kiosk.station", $("station").value.trim());
  showForm();
};

/* ---------- employer check-in screen ---------- */
function showForm() {
  const ev = store.get("kiosk.event", null);
  if (!ev) return showSetup();
  $("screen-setup").classList.remove("active");
  $("screen-form").classList.add("active");
  $("footer").style.display = "flex";
  $("headTitle").textContent = ev.name;
  $("headSub").textContent = "Welcome! Enter your details and your name tag will print.";
  $("stationLabel").textContent = store.get("kiosk.station", "") || "";
  updateQueueLabel();
  $("name").focus();
}

// Hidden staff exit: tap the dark header 5 times quickly, then enter the PIN
let taps = 0, tapTimer = null;
$("head").addEventListener("click", () => {
  if (!$("screen-form").classList.contains("active")) return;
  taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 2000);
  if (taps >= 5) {
    taps = 0;
    const pin = prompt("Staff PIN:");
    if (pin === CONFIG.STAFF_PIN) showSetup();
  }
});

function validate(d) {
  let ok = true;
  const mark = (id, bad) => { $("f-" + id).classList.toggle("invalid", bad); if (bad) ok = false; };
  mark("name", !d.name); mark("company", !d.company); mark("jobTitle", !d.jobTitle);
  mark("email", !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email));
  return ok;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const ev = store.get("kiosk.event", null);
  const d = {
    name: $("name").value.trim(), company: $("company").value.trim(),
    jobTitle: $("jobTitle").value.trim(), email: $("email").value.trim()
  };
  $("formStatus").textContent = ""; $("formStatus").className = "status";
  if (!validate(d)) return;

  $("submitBtn").disabled = true; $("submitBtn").textContent = "Checking in…";

  const record = {
    eventId: ev.id, eventName: ev.name, ...d,
    timestamp: new Date().toISOString(),
    station: store.get("kiosk.station", "")
  };

  // 1) Save the record. If the internet is down, keep it on this laptop and retry later.
  try { await api("checkIn", record); } catch (err) { enqueue(record); }

  // 2) Print the label.
  let printed = true;
  try { await printLabel(d); } catch (err) { printed = false; }

  $("overlayMsg").textContent = printed
    ? "Your name tag is printing now. Welcome!"
    : "You're checked in, but the name tag didn't print. Please let a staff member know.";
  $("overlay").classList.add("show");

  setTimeout(() => {
    $("overlay").classList.remove("show");
    $("form").reset();
    document.querySelectorAll(".field").forEach(f => f.classList.remove("invalid"));
    $("submitBtn").disabled = false; $("submitBtn").textContent = "Check in & print name tag";
    $("name").focus();
  }, printed ? CONFIG.RESET_DELAY_MS : CONFIG.RESET_DELAY_MS + 3000);
});

/* ---------- offline safety net ---------- */
function enqueue(r) { const q = store.get("kiosk.queue", []); q.push(r); store.set("kiosk.queue", q); updateQueueLabel(); }
function updateQueueLabel() {
  const n = store.get("kiosk.queue", []).length;
  $("queueLabel").textContent = n ? n + " waiting to sync" : "";
}
async function flushQueue() {
  let q = store.get("kiosk.queue", []);
  while (q.length) {
    try { await api("checkIn", q[0]); q.shift(); store.set("kiosk.queue", q); }
    catch (e) { break; }
  }
  updateQueueLabel();
}
setInterval(flushQueue, 30000);

/* ---------- DYMO printing ---------- */
async function printLabel(d) {
  if (typeof dymo === "undefined") throw new Error("DYMO framework not loaded");
  if (!labelXml) {
    const r = await fetch(CONFIG.LABEL_FILE);
    if (!r.ok) throw new Error("Label file not found");
    labelXml = await r.text();
  }
  const label = dymo.label.framework.openLabelXml(labelXml);
  // These names must match the text box names in your label template
  const map = { NAME: d.name, COMPANY: d.company, TITLE: d.jobTitle };
  for (const k in map) { try { label.setObjectText(k, map[k]); } catch (e) {} }

  const printers = dymo.label.framework.getPrinters();
  const p = printers.find(x => x.printerType === "LabelWriterPrinter" && x.isConnected !== false) || printers[0];
  if (!p) throw new Error("No DYMO printer found");
  label.print(p.name);
}

/* ---------- start ---------- */
window.addEventListener("load", () => {
  try { if (typeof dymo !== "undefined" && dymo.label.framework.init) dymo.label.framework.init(); } catch (e) {}
  store.get("kiosk.event", null) ? showForm() : showSetup();
  flushQueue();
});
</script>
</body>
</html>
