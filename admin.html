<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-In Admin | UA Career Center</title>
<style>
  /* UA brand palette: primary = Crimson Flame, Capstone Gray, Victory White.
     Chimes Gray (secondary) is used only for thin borders. No tints/shades. */
  :root{
    --crimson:#9E1B32; --capstone:#828A8F; --white:#FFFFFF; --chimes:#C1C6C9; --ink:#222222;
    --serif:"Minion Pro","Minion",Georgia,"Times New Roman",serif;
    --sans:"Trade Gothic Next","Trade Gothic","Trade Gothic LT Std","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--white);color:var(--ink);font-family:var(--sans);}
  button,input{font-family:var(--sans);}

  .topbar{background:var(--crimson);color:var(--white);display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:14px 32px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand img{height:44px;width:auto;display:block;}
  .nameplate{display:flex;flex-direction:column;line-height:1.15;}
  .nameplate .ua{font-size:13px;letter-spacing:2.2px;text-transform:uppercase;font-weight:700;}
  .nameplate .unit{font-family:var(--serif);font-size:19px;}
  .tools{display:flex;gap:10px;}
  .tool{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:transparent;color:var(--white);
    border:1.5px solid var(--white);border-radius:3px;font-size:13px;font-weight:700;letter-spacing:.6px;
    text-transform:uppercase;cursor:pointer;text-decoration:none;}
  .tool:hover,.tool:active{background:var(--white);color:var(--crimson);}
  .tool svg{width:15px;height:15px;}
  .tool[hidden]{display:none;}
  .rule{height:5px;background:var(--capstone);}

  .page-head{max-width:900px;margin:0 auto;padding:34px 24px 6px;}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--capstone);margin:0 0 8px;}
  .page-head h1{margin:0;font-family:var(--serif);font-weight:600;font-size:34px;color:var(--crimson);}
  .page-head p{margin:8px 0 0;font-size:16px;}

  main{max-width:900px;margin:0 auto;padding:22px 24px 60px;}
  .panel{background:var(--white);border:1px solid var(--chimes);border-top:4px solid var(--crimson);border-radius:3px;
    padding:24px 26px;margin-bottom:22px;}
  .panel h2{margin:0 0 16px;font-family:var(--serif);font-weight:600;font-size:22px;color:var(--crimson);}
  .panel h2 .muted{font-family:var(--sans);font-size:14px;font-weight:400;}
  label{display:block;font-size:12.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;}
  input{width:100%;padding:11px 13px;font-size:15px;border:1.5px solid var(--capstone);border-radius:3px;background:var(--white);color:var(--ink);}
  input:focus{outline:none;border-color:var(--crimson);box-shadow:0 0 0 1px var(--crimson);}
  .row{display:grid;grid-template-columns:2fr 1fr auto;gap:12px;align-items:end;}
  button{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:12px 16px;border-radius:3px;
    cursor:pointer;border:1.5px solid var(--crimson);background:var(--crimson);color:var(--white);white-space:nowrap;}
  button.ghost{background:var(--white);color:var(--crimson);}
  button.danger,button.quiet{background:var(--white);color:var(--ink);border-color:var(--capstone);}
  button:disabled{opacity:.5;cursor:default;}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:15px;}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--capstone);
    padding:0 10px 10px;border-bottom:2px solid var(--chimes);}
  td{padding:14px 10px;border-bottom:1px solid var(--chimes);vertical-align:middle;}
  td:first-child{font-weight:700;}
  td.actions{text-align:right;white-space:nowrap;}
  td.actions button{margin-left:8px;}
  .msg{font-size:14px;margin-top:12px;min-height:18px;font-weight:700;}
  .msg.error{color:var(--crimson);} .msg.ok{color:var(--ink);}
  .msg.ok::before{content:"\2713  ";color:var(--crimson);}
  .muted{color:var(--capstone);font-size:14px;}

  [hidden]{display:none !important;}

  @media (max-width:640px){
    .row{grid-template-columns:1fr;} .topbar{padding:12px 16px;} .tool .lbl{display:none;}
    .page-head h1{font-size:28px;} td.actions button{margin:4px 0 0 6px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <!-- Optional: put the official UA logo file (from brand.ua.edu, white version) in this folder as ua-logo.png -->
    <img src="ua-logo.png" alt="" onerror="this.remove()">
    <div class="nameplate">
      <span class="ua">The University of Alabama</span>
      <span class="unit">Career Center</span>
    </div>
  </div>
  <div class="tools">
    <a class="tool" href="checkin.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="lbl">Back to kiosk</span>
    </a>
  </div>
</header>
<div class="rule"></div>

<div class="page-head">
  <p class="eyebrow">Admin</p>
  <h1>Employer Check-In</h1>
  <p>Add or archive events and download check-in data.</p>
</div>

<main>
  <div class="panel">
    <h2>1. Admin PIN</h2>
    <label for="pin">Enter the admin PIN to make changes or download data</label>
    <input type="password" id="pin" autocomplete="off" style="max-width:260px;">
  </div>

  <div class="panel">
    <h2>2. Add an event</h2>
    <div class="row">
      <div><label for="evName">Event name</label><input id="evName" placeholder="Fall Career Fair 2026"></div>
      <div><label for="evDate">Date</label><input id="evDate" type="date"></div>
      <button id="addBtn">Add event</button>
    </div>
    <div class="msg" id="addMsg"></div>
  </div>

  <div class="panel">
    <h2>3. Active events <span class="muted" style="font-weight:400;">(shown on the kiosks)</span></h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Event</th><th>Date</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="msg" id="listMsg"></div>
  </div>

  <div class="panel">
    <h2>4. Archived events <span class="muted" style="font-weight:400;">(hidden from kiosks, data kept)</span></h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Event</th><th>Date</th><th></th></tr></thead>
        <tbody id="archRows"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script>
/* =================== SETTINGS: edit this =================== */
const FLOW_URL = "https://default2a00728ef0d040b4a4e8ce433f3fbc.a7.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/06/workflows/30158550df024f02ba3f40b3508cc092/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=F7C6GR3YP7e8fCqVCA5MXHa_8WqUA6i_Bg63xjuGbxM"; // same URL as checkin.html
/* =========================================================== */

const $ = id => document.getElementById(id);

async function api(action, payload = {}) {
  const res = await fetch(FLOW_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, pin: $("pin").value, ...payload })
  });
  if (res.status === 401) throw new Error("Wrong admin PIN.");
  if (!res.ok) throw new Error("Something went wrong (status " + res.status + ").");
  const t = await res.text();
  return t ? JSON.parse(t) : {};
}

function setMsg(id, text, type) { $(id).textContent = text; $(id).className = "msg " + (type || ""); }

function makeRow(ev, archived) {
  const tr = document.createElement("tr");
  const tdName = document.createElement("td"); tdName.textContent = ev.name;
  const tdDate = document.createElement("td"); tdDate.textContent = ev.date || "";
  const tdAct = document.createElement("td"); tdAct.className = "actions";

  const dl = document.createElement("button");
  dl.className = "ghost"; dl.textContent = "Download CSV";
  dl.onclick = () => downloadCsv(ev, dl);

  const st = document.createElement("button");
  st.className = archived ? "ghost" : "danger";
  st.textContent = archived ? "Restore" : "Archive";
  st.onclick = () => setStatus(ev, archived ? "Active" : "Archived", st);

  tdAct.append(dl, st);
  tr.append(tdName, tdDate, tdAct);
  return tr;
}

async function loadEvents() {
  const tbody = $("rows"), abody = $("archRows");
  try {
    const events = await api("getEvents");
    const active = events.filter(ev => ev.status !== "Archived");
    const archived = events.filter(ev => ev.status === "Archived");
    tbody.innerHTML = ""; abody.innerHTML = "";

    if (!active.length) tbody.innerHTML = '<tr><td colspan="3" class="muted">No active events. Add one above.</td></tr>';
    else active.forEach(ev => tbody.appendChild(makeRow(ev, false)));

    if (!archived.length) abody.innerHTML = '<tr><td colspan="3" class="muted">No archived events.</td></tr>';
    else archived.forEach(ev => abody.appendChild(makeRow(ev, true)));
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="3" class="muted">Couldn\'t load events. Check the FLOW_URL setting.</td></tr>';
    abody.innerHTML = "";
  }
}

$("addBtn").onclick = async () => {
  const name = $("evName").value.trim();
  if (!name) return setMsg("addMsg", "Please enter an event name.", "error");
  $("addBtn").disabled = true;
  try {
    await api("addEvent", { eventName: name, eventDate: $("evDate").value });
    $("evName").value = ""; $("evDate").value = "";
    setMsg("addMsg", "Event added.", "ok");
    loadEvents();
  } catch (e) { setMsg("addMsg", e.message, "error"); }
  $("addBtn").disabled = false;
};

async function setStatus(ev, status, btn) {
  if (status === "Archived" &&
      !confirm('Archive "' + ev.name + '"? It will be hidden from the kiosks. All check-in data is kept and you can still download it or restore the event.')) return;
  btn.disabled = true;
  try {
    await api("setEventStatus", { eventId: String(ev.id), eventName: ev.name, status });
    setMsg("listMsg", status === "Archived" ? "Event archived." : "Event restored.", "ok");
    loadEvents();
  } catch (e) { setMsg("listMsg", e.message, "error"); btn.disabled = false; }
}

function fmt(iso) {
  const d = new Date(iso); if (isNaN(d)) return iso || "";
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
         p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
const cell = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';

async function downloadCsv(ev, btn) {
  btn.disabled = true; btn.textContent = "Preparing…";
  try {
    const rows = await api("getCheckIns", { eventId: String(ev.id) });
    rows.sort((a, b) => String(a.timestamp).localeCompare(String(b.timestamp)));
    const header = ["Timestamp", "Event", "Name", "Email", "Company", "Job Title", "Station"];
    const lines = [header.map(cell).join(",")].concat(rows.map(r =>
      [fmt(r.timestamp), ev.name, r.name, r.email, r.company, r.jobTitle, r.station].map(cell).join(",")
    ));
    const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = ev.name.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "_") + "_checkins.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setMsg("listMsg", rows.length + " check-ins downloaded for " + ev.name + ".", "ok");
  } catch (e) { setMsg("listMsg", e.message, "error"); }
  btn.disabled = false; btn.textContent = "Download CSV";
}

// PIN typed on the kiosk's Admin button (this tab only; removed once read)
try { const k = sessionStorage.getItem("ua.admin.key"); if (k) { $("pin").value = k; sessionStorage.removeItem("ua.admin.key"); } } catch (e) {}

loadEvents();
</script>
</body>
</html>
